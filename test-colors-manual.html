<!DOCTYPE html>
<html>
<head>
    <title>Test Color Changes</title>
    <style>
        .main-block {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            background-image: linear-gradient(to bottom, #9a8478, #1e130c);
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.3);
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="main-block" id="main-block">
        <div>
            <div id="time-display">Current Time</div>
            <div id="color-display">Current Color</div>
            <button onclick="testHour(6)">6 AM (Dawn)</button>
            <button onclick="testHour(9)">9 AM (Morning)</button>
            <button onclick="testHour(12)">12 PM (Late Morning)</button>
            <button onclick="testHour(15)">3 PM (Afternoon)</button>
            <button onclick="testHour(18)">6 PM (Early Evening)</button>
            <button onclick="testHour(21)">9 PM (Evening)</button>
            <button onclick="testHour(0)">12 AM (Night)</button>
        </div>
    </div>

    <script>
        const times_of_day = {
            early_morning: { name: "Early Morning", value: "background-image: linear-gradient(to bottom, #232526, #414345);" },
            dawn: { name: "Dawn", value: "background-image: linear-gradient(to bottom, #f7971e, #ffd200, #f7971e, #ffd200);" },
            morning: { name: "Morning", value: "background-image: linear-gradient(to bottom, #a1c4fd, #c2e9fb);" },
            late_morning: { name: "Late Morning", value: "background-image: linear-gradient(to bottom, #fceabb, #f8b500);" },
            afternoon: { name: "Afternoon", value: "background-image: linear-gradient(to bottom, #00c6fb, #005bea);" },
            late_afternoon: { name: "Late Afternoon", value: "background-image: linear-gradient(to bottom, #f7971e, #ffd200);" },
            early_evening: { name: "Early Evening", value: "background-image: linear-gradient(to bottom, #f857a6, #ff5858);" },
            evening: { name: "Evening", value: "background-image: linear-gradient(to bottom, #667db6, #0082c8, #0082c8, #667db6);" },
            dusk: { name: "Dusk", value: "background-image: linear-gradient(to bottom, #232526, #414345, #0f2027);" },
            night: { name: "Night", value: "background-image: linear-gradient(to bottom, #141e30, #243b55);" },
            midnight: { name: "Midnight", value: "background-image: linear-gradient(to bottom, #000428, #004e92);" },
            middle_of_the_night: { name: "Middle of the Night", value: "background-image: linear-gradient(to bottom, #000000, #434343);" },
            default: { name: "", value: "background-image: linear-gradient(to bottom, #83a4d4, #b6fbff);" },
        };

        function testHour(hour) {
            let partOfDay = times_of_day.default;
            if (hour >= 1 && hour <= 2) partOfDay = times_of_day.middle_of_the_night;
            else if (hour > 2 && hour <= 5) partOfDay = times_of_day.early_morning;
            else if (hour > 5 && hour <= 6) partOfDay = times_of_day.dawn;
            else if (hour > 6 && hour <= 9) partOfDay = times_of_day.morning;
            else if (hour > 9 && hour <= 12) partOfDay = times_of_day.late_morning;
            else if (hour > 12 && hour <= 16) partOfDay = times_of_day.afternoon;
            else if (hour > 16 && hour <= 17) partOfDay = times_of_day.late_afternoon;
            else if (hour > 17 && hour <= 18) partOfDay = times_of_day.early_evening;
            else if (hour > 18 && hour <= 19) partOfDay = times_of_day.dusk;
            else if (hour > 19 && hour <= 21) partOfDay = times_of_day.evening;
            else if (hour > 21) partOfDay = times_of_day.night;

            console.log(`Hour: ${hour}, PartOfDay: ${partOfDay.name}, CSS: ${partOfDay.value}`);
            document.getElementById('main-block').style.cssText = partOfDay.value.replace('background-image:', 'background-image: !important;');
            document.getElementById('time-display').textContent = `${hour}:00 - ${partOfDay.name}`;
            document.getElementById('color-display').textContent = partOfDay.value;
        }

        // Test current time
        const now = new Date();
        testHour(now.getHours());
    </script>
</body>
</html>
