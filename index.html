<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Instant Weather — real-time forecasts for any city worldwide."
    />
    <meta name="theme-color" content="#141e30" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/png" href="/assets/images/sun.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Instant Weather</title>
  </head>
  <body class="home">
    <div class="home-container">
      <img
        src="/assets/images/sun.png"
        alt="Instant Weather Logo"
        class="home-logo"
        width="90"
        height="90"
      />
      <h1 class="home-greeting">Instant Weather</h1>
      <p class="home-tagline">
        Real-time weather + 5-day forecasts for any city in the world. Detects your location
        automatically.
      </p>
      <div class="home-features">
        <span class="home-feature-chip">Geolocation</span>
        <span class="home-feature-chip">5-Day Forecast</span>
        <span class="home-feature-chip">Air Quality</span>
        <span class="home-feature-chip">Installable PWA</span>
        <span class="home-feature-chip">Works Offline</span>
      </div>
      <a href="weather.html" class="home-button">Check the Weather</a>
    </div>

    <script type="module" src="/src/heroAnimation.ts"></script>

    <!-- Cloudflare Web Analytics — privacy-first, cookieless. Replace the
         token with the one from Cloudflare dashboard → Web Analytics. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "REPLACE_WITH_CLOUDFLARE_TOKEN"}'
    ></script>
  </body>
</html>
