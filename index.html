<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Instant Weather</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/images/sun.png" />
    <style>
        /* Additional styles for the home page */
        body.home {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden; /* Prevent scrollbars */
        }
        .home-container {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            color: white;
            max-width: 600px;
        }
        .home-logo {
            width: 150px;
            margin-bottom: 20px;
        }
        .home-greeting {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .home-button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.2rem;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .home-button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body class="home">
    <div class="home-container">
        <img src="assets/images/sun.png" alt="Instant Weather Logo" class="home-logo">
        <h1 class="home-greeting">Welcome to Instant Weather</h1>
        <p style="margin-bottom: 30px; font-size: 1.1rem;">Get real-time weather updates for any city in the world.</p>
        <a href="weather.html" class="home-button">Check the Weather</a>
    </div>
</body>
</html>
